---
- name: Common setup (server + client)
  hosts: all
  become: true
  tasks:
    - name: Do not start iperf3 as daemon (debconf)
      ansible.builtin.debconf:
        name: iperf3
        question: iperf3/start_daemon
        value: "false"
        vtype: boolean

    - name: Install packages
      ansible.builtin.apt:
        name: [openvpn, iperf3, selinux-utils]
        state: present
        update_cache: true

    - name: Disable SELinux (setenforce 0)
      ansible.builtin.command: setenforce 0
      register: se
      failed_when: false
      changed_when: false

    - name: Create openvpn@.service unit
      ansible.builtin.template:
        src: openvpn@.service.j2
        dest: /etc/systemd/system/openvpn@.service
        mode: "0644"

- name: Host 1 - server
  hosts: server
  become: true
  vars:
    vpn_dev: tap
  tasks:
    - name: Generate static key
      ansible.builtin.command: openvpn --genkey secret /etc/openvpn/static.key
      args:
        creates: /etc/openvpn/static.key

    - name: Fetch static key to Ansible host
      ansible.builtin.fetch:
        src: /etc/openvpn/static.key
        dest: "{{ playbook_dir }}/files/static.key"
        flat: true

    - name: Server config
      ansible.builtin.template:
        src: server.conf.j2
        dest: /etc/openvpn/server.conf
        mode: "0644"
      notify: Restart openvpn

    - name: Start and enable openvpn@server
      ansible.builtin.systemd:
        name: openvpn@server
        state: started
        enabled: true
        daemon_reload: true

  handlers:
    - name: Restart openvpn
      ansible.builtin.systemd:
        name: openvpn@server
        state: restarted

- name: Host 2 - client
  hosts: client
  become: true
  vars:
    vpn_dev: tap
  tasks:
    - name: Copy static key from server
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/files/static.key"
        dest: /etc/openvpn/static.key
        mode: "0600"
      notify: Restart openvpn

    - name: Client config
      ansible.builtin.template:
        src: client.conf.j2
        dest: /etc/openvpn/server.conf
        mode: "0644"
      notify: Restart openvpn

    - name: Start and enable openvpn@server
      ansible.builtin.systemd:
        name: openvpn@server
        state: started
        enabled: true
        daemon_reload: true

  handlers:
    - name: Restart openvpn
      ansible.builtin.systemd:
        name: openvpn@server
        state: restarted
