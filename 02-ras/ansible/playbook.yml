---
- name: RAS on OpenVPN
  hosts: server
  become: true
  vars:
    easyrsa: /usr/share/easy-rsa/easyrsa
    ovpn: /etc/openvpn
  tasks:
    - name: Install packages
      ansible.builtin.apt:
        name: [openvpn, easy-rsa, selinux-utils]
        state: present
        update_cache: true

    - name: Disable SELinux (setenforce 0)
      ansible.builtin.command: setenforce 0
      failed_when: false
      changed_when: false

    - name: Create openvpn@.service unit
      ansible.builtin.template:
        src: openvpn@.service.j2
        dest: /etc/systemd/system/openvpn@.service
        mode: "0644"

    - name: Init PKI
      ansible.builtin.command: "{{ easyrsa }} init-pki"
      args: { chdir: "{{ ovpn }}", creates: "{{ ovpn }}/pki" }

    - name: Build CA
      ansible.builtin.shell: "echo 'rasvpn' | {{ easyrsa }} build-ca nopass"
      args: { chdir: "{{ ovpn }}", creates: "{{ ovpn }}/pki/ca.crt" }

    - name: Server request
      ansible.builtin.shell: "echo 'rasvpn' | {{ easyrsa }} gen-req server nopass"
      args: { chdir: "{{ ovpn }}", creates: "{{ ovpn }}/pki/reqs/server.req" }

    - name: Sign server certificate
      ansible.builtin.shell: "echo 'yes' | {{ easyrsa }} sign-req server server"
      args: { chdir: "{{ ovpn }}", creates: "{{ ovpn }}/pki/issued/server.crt" }

    - name: Generate DH
      ansible.builtin.command: "{{ easyrsa }} gen-dh"
      args: { chdir: "{{ ovpn }}", creates: "{{ ovpn }}/pki/dh.pem" }

    - name: Generate ca.key (openvpn --genkey secret)
      ansible.builtin.command: openvpn --genkey secret ca.key
      args: { chdir: "{{ ovpn }}", creates: "{{ ovpn }}/ca.key" }

    - name: Client request
      ansible.builtin.shell: "echo 'client' | {{ easyrsa }} gen-req client nopass"
      args: { chdir: "{{ ovpn }}", creates: "{{ ovpn }}/pki/reqs/client.req" }

    - name: Sign client certificate
      ansible.builtin.shell: "echo 'yes' | {{ easyrsa }} sign-req client client"
      args: { chdir: "{{ ovpn }}", creates: "{{ ovpn }}/pki/issued/client.crt" }

    - name: No iroute for tunnel network (it blocks push route 10.10.10.0/24, see README)
      ansible.builtin.file:
        path: "{{ ovpn }}/client/client"
        state: absent

    - name: Server config
      ansible.builtin.template:
        src: server.conf.j2
        dest: "{{ ovpn }}/server.conf"
        mode: "0644"
      notify: Restart openvpn

    - name: Start and enable openvpn@server
      ansible.builtin.systemd:
        name: openvpn@server
        state: started
        enabled: true
        daemon_reload: true

    - name: Fetch client files to host
      ansible.builtin.fetch:
        src: "{{ item }}"
        dest: "{{ playbook_dir }}/../client/"
        flat: true
      loop:
        - "{{ ovpn }}/pki/ca.crt"
        - "{{ ovpn }}/pki/issued/client.crt"
        - "{{ ovpn }}/pki/private/client.key"

  handlers:
    - name: Restart openvpn
      ansible.builtin.systemd:
        name: openvpn@server
        state: restarted
